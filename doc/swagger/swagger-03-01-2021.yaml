          description: 'The server has fulfilled the request but does not need to return an entity-body, and might want to return updated meta information. The response MAY include new or updated meta information in the form of entity-headers, which if present SHOULD associate with the requested variant.'
        '400':
          description: The request could not be understood by the server due to malformed syntax. The client SHOULD NOT repeat the request without modifications.
        '405':
          description: The method specified in the Request-Line is not allowed for the resource identified by the Request-URI. The response MUST include an Allow header containing a list of valid methods for the requested resource.
        '411':
          description: The server refuses to accept the request without a defined Content-Length. The client MAY repeat the request if it adds a valid Content-Length header field containing the length of the message-body in the request message.
        '413':
          description: 'The server refuses to process a request because the requesting entity is larger than the server is willing or able to process. The server MAY close the connection to prevent the client from continuing the request. If the condition is temporary, the server SHOULD include a Retry- After header field to indicate that it is temporary and after what time the client MAY try again.'
        '415':
          description: The server refuses to service the request because the entity of the request is in a format not supported by the requested resource for the requested method.
